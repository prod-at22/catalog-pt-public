# Mirror of the PT R&D Costing Hub (prod-at22/pt-calculator-hub) — the only source of these catalogs:
# content in data/catalogs/, prices (Costing) and add-ons (Add On) in data/data.json, builder in
# catalog-build/. The hub's Save starts this workflow at once (workflow_dispatch); the schedule is only a
# fallback (GitHub runs it rarely). catalog-build/changed.py resolves every catalog at the last mirrored
# hub commit (.hub-sha) and now, and only the catalogs whose page would differ are rebuilt — all of them
# when catalog-build/ changed. No token: the hub is public, and this workflow writes only to this repo.
# "Run workflow" mirrors at once (slugs = rebuild just those, "all" = everything).
name: Mirror from PT R&D Costing Hub
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
    inputs:
      slugs:
        description: "Force rebuild of these catalogs (space-separated), or 'all'"
        type: string
        default: ""
permissions: { contents: write }
concurrency: { group: mirror, cancel-in-progress: false }
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: prod-at22/pt-calculator-hub, path: _hub, fetch-depth: 0 }
      - name: What changed in the hub
        id: pick
        run: |
          new=$(git -C _hub log -1 --format=%H -- data/catalogs data/data.json catalog-build)
          last=$(cat .hub-sha 2>/dev/null || true)
          force="${{ inputs.slugs }}"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ -n "$force" ]; then
            [ "$force" = "all" ] && force=""
            echo "run=yes" >> "$GITHUB_OUTPUT"; echo "slugs=$force" >> "$GITHUB_OUTPUT"; echo "forced: ${force:-all}"; exit 0
          fi
          if [ "$new" = "$last" ]; then echo "run=no" >> "$GITHUB_OUTPUT"; echo "up to date ($new)"; exit 0; fi
          echo "run=yes" >> "$GITHUB_OUTPUT"
          # catalogs whose page differs between the last mirror and now (prices + add-ons come from data.json)
          out=$( [ -n "$last" ] && cd _hub && python3 catalog-build/changed.py "$last" "$new" || echo ALL )
          if [ "$out" = "ALL" ]; then
            echo "slugs=" >> "$GITHUB_OUTPUT"; echo "rebuild all ($last → $new)"
          else
            ch=$(printf '%s\n' $out | grep -v '^-' | tr '\n' ' ' || true)   # pipefail: grep finds nothing → not an error
            gone=$(printf '%s\n' $out | sed -n 's/^-//p' | tr '\n' ' ')
            ch=$(echo $ch); gone=$(echo $gone)   # trim, so "nothing changed" is really empty
            echo "slugs=$ch" >> "$GITHUB_OUTPUT"; echo "gone=$gone" >> "$GITHUB_OUTPUT"; echo "changed: $ch · removed: $gone"
            [ -z "$ch" ] && [ -z "$gone" ] && echo "index=only" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.run == 'yes'
        with: { python-version: "3.12" }
      - name: Build
        if: steps.pick.outputs.run == 'yes'
        timeout-minutes: 40
        env: { PT_SITE: "${{ github.workspace }}" }
        run: |
          pip install -q -r _hub/catalog-build/requirements.txt
          for s in ${{ steps.pick.outputs.gone }}; do git rm -q --ignore-unmatch "$s.html" "$s.pdf"; done
          if [ "${{ steps.pick.outputs.index }}" = "only" ]; then
            echo "only the hub's index.json changed: nothing to render"
          else
            python -u _hub/catalog-build/build.py ${{ steps.pick.outputs.slugs }}
          fi
      - name: Commit
        if: steps.pick.outputs.run == 'yes'
        run: |
          echo "${{ steps.pick.outputs.new }}" > .hub-sha
          git config user.name "PT R&D Costing Hub"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A   # _hub/ is in .gitignore
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -q -m "Mirror from PT R&D Costing Hub ${{ steps.pick.outputs.new }}: ${{ steps.pick.outputs.slugs || 'all/index' }}"
          git push
